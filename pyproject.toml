[tool.mypy]
strict = true
mypy_path = "src"
explicit_package_bases = true
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
